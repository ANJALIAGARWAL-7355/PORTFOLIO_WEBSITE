<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c481ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <rect width="800" height="500" rx="16" fill="url(#grid)"/>

  <!-- Glowing background elements -->
  <circle cx="650" cy="150" r="140" fill="#7000ff" opacity="0.25" filter="blur(40px)"/>
  <circle cx="150" cy="380" r="100" fill="#c481ff" opacity="0.2" filter="blur(30px)"/>

  <!-- Icon Graphic -->
  <g transform="translate(400, 190) scale(1.1)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#c084fc" stroke-width="3"/>
       <circle cx="0" cy="0" r="28" fill="#7e22ce" opacity="0.6"/>
       <path d="M 0 -22 L 5 -8 L 20 -5 L 8 5 L 12 20 L 0 12 L -12 20 L -8 5 L -20 -5 L -5 -8 Z" fill="#fef08a"/>
       <circle cx="-50" cy="-25" r="8" fill="#38bdf8"/>
       <circle cx="50" cy="-25" r="8" fill="#38bdf8"/>
       <circle cx="-45" cy="30" r="8" fill="#38bdf8"/>
       <circle cx="45" cy="30" r="8" fill="#38bdf8"/>
       <line x1="-50" y1="-25" x2="-25" y2="-12" stroke="#c084fc" stroke-width="2"/>
       <line x1="50" y1="-25" x2="25" y2="-12" stroke="#c084fc" stroke-width="2"/>
       <line x1="-45" y1="30" x2="-22" y2="15" stroke="#c084fc" stroke-width="2"/>
       <line x1="45" y1="30" x2="22" y2="15" stroke="#c084fc" stroke-width="2"/>
  </g>

  <!-- Card Information -->
  <rect x="60" y="360" width="160" height="30" rx="15" fill="rgba(196, 129, 255, 0.15)" stroke="#c481ff" stroke-width="1.5"/>
  <text x="140" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c481ff" text-anchor="middle" letter-spacing="1">LLM & GENERATIVE AI</text>

  <text x="60" y="425" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="0.5">Generative AI & RAG Assistant</text>
  <text x="60" y="455" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" fill="#a1a1aa">Anjali Agarwal • AI/ML &amp; Software Engineering Project</text>
</svg>